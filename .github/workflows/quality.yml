name: Quality and acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: janiwheels_acceptance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/janiwheels_acceptance_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_DIST_DIR: .next-build
      IMAGE_PROVIDER: local
      UPLOAD_DIR: /tmp/janiwheels-acceptance-uploads
      ACCEPTANCE_EMAIL_DIR: /tmp/janiwheels-acceptance-mail
      ACCEPTANCE_BASE_URL: http://127.0.0.1:3100
      SWEEP_BASE: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx tsx src/db/seed/demo.ts
      - run: npm run test:db
      - run: node --import tsx scripts/seed-acceptance-accounts.ts
      - run: npm run check
      - run: npm run lint
      - run: npm run build:safe
      - name: Start acceptance server
        run: |
          npm run start -- --port 3100 > /tmp/janiwheels-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/janiwheels-server.log
          exit 1
      - run: npm run sweep
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-failure
          path: |
            playwright-report/
            test-results/
            /tmp/janiwheels-server.log
